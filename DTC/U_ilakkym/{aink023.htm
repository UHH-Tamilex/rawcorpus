<H2>Aiṅkuṟunūṟu</H2>
<P><i>((Originally extracted from master file ^KALI.OCP))</i>
<BR><i>((Last updated on 2004 April 14th))</i>

<UL>
<LI>{AING 23-1} muḷḷi vēr aḷi kaḷavaṉ āṭṭi
<LI>{AING 23-2} pū kuṟṟu eytiya puṉal aṇi ūraṉ
<LI>{AING 23-3} tēṟṟam ceytu nam puṇarntu iṉi
<LI>{AING 23-4} tākku aṇaṅku āvatu evaṉ kol aṉṉāy
</UL>
