<UL>
<LI>{AING 66-1} uṭaliṉeṉ allēṉ poyyātu uraimō
<LI>{AING 66-2} yār avaḷ makiḻna tāṉ ē tēroṭu
<LI>{AING 66-3} taḷar naṭai putalvaṉai uḷḷi niṉ
<LI>{AING 66-4} vaḷa maṉai varutal um vauviyōḷ ē
