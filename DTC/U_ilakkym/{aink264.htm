<UL>
<LI>{AING 264-1} iḷam piṟai aṉṉa kōṭṭa kēḻal
<LI>{AING 264-2} kaḷam kaṉi aṉṉa peṇ pāl puṇarum
<LI>{AING 264-3} ayam tikaḻ cilampa kaṇṭikum
