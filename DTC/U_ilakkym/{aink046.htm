<UL>
<LI>{AING 46-1} niṉakku ē aṉṟu aḵtu emakku um ār iṉitu ē
<LI>{AING 46-2} niṉ mārpu nayanta nal nutal arivi
<LI>{AING 46-3} vēṇṭiya kuṟippiṉi āki
