<UL>
<LI>{AING 298-1} maḻi varavu aṟiyā maññi ālum
<LI>{AING 298-2} aṭukkal nal ūr aci naṭi koṭicci
<LI>{AING 298-3} tāṉ em aruḷāḷ āyiṉum
<LI>{AING 298-4} yām taṉ uḷḷupu maṟantaṟiyēm ē
