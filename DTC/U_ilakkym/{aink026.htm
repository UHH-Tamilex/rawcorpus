<P><i>((Originally extracted from master file ^KALI.OCP))</i>
<BR><i>((Last updated on 2004 April 14th))</i>

<UL>
<LI>{AING 26-1} karantai am ceṟuvil tuṇai tuṟantu kaḷavaṉ
<LI>{AING 26-2} vaḷḷai mel kāl aṟukkum ūraṉ
<LI>{AING 26-3} em um piṟar um aṟiyāṉ
<LI>{AING 26-4} iṉṉaṉ āvatu evaṉ kol aṉṉāy
</UL>
