<H2>Aiṅkuṟunūṟu</H2>
<P><i>((Originally extracted from master file ^KALI.OCP))</i>
<BR><i>((Last updated on 2004 April 14th))</i>

<UL>
<LI>{AING 427-1} pēr amar malar kaṇ maṭanti nī ē
<LI>{AING 427-2} kār etir poḻutu eṉa viṭal ollāy ō
<LI>{AING 427-3} pōr uṭi vēntaṉ pācaṟi
<LI>{AING 427-4} vārāṉ avaṉ eṉa celavu aḻuṅkiṉaṉ ē
</UL>
