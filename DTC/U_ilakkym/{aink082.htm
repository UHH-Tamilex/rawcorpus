<H2>Aiṅkuṟunūṟu</H2>
<P><i>((Originally extracted from master file ^KALI.OCP))</i>
<BR><i>((Last updated on 2004 April 14th))</i>

<UL>
<LI>{AING 82-1} vekuṇṭaṉaḷ eṉpa pāṇa niṉ talimakaḷ
<LI>{AING 82-2} makiḻnaṉ mārpiṉ aviḻ iṇar naṟum tār
<LI>{AING 82-3} tātu uṇ paṟavi vantu em
<LI>{AING 82-4} pōtu ār kūntal iruntaṉa eṉa ē
</UL>
