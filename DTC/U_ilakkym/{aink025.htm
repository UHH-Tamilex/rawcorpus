<UL>
<LI>{AING 25-1} puyal puṟantanta puṉiṟṟu vaḷar pim kāy
<LI>{AING 25-2} vayali ce koṭi kaḷavaṉ aṟukkum
<LI>{AING 25-3} kaḻaṉi ūraṉ mārpu palarkku
<LI>{AING 25-4} iḻi nekiḻ cellal ākkum aṉṉay
