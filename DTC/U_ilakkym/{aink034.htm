<UL>
<LI>{AING 34-1} amma vāḻi tōḻi nam ūr
<LI>{AING 34-2} poyki pūtta puḻi kāl āmpal
<LI>{AING 34-3} tātu ēr vaṇṇam koṇṭaṉa
<LI>{AING 34-4} ētilāḷarkku pacanta eṉ kaṇ ē
