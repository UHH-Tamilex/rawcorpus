<H2>Aiṅkuṟunūṟu</H2>
<P><i>((Originally extracted from master file ^KALI.OCP))</i>
<BR><i>((Last updated on 2004 April 14th))</i>

<UL>
<LI>{AING 30-1} vēppu naṉi aṉṉa neṭum kaṇ kaḷavaṉ
<LI>{AING 30-2} taṇ aka maṇ aḷi niṟiya nelliṉ
<LI>{AING 30-3} irum pū uṟikkum ūraṟku ivaḷ
<LI>{AING 30-4} perum kaviṉ iḻappatu evaṉ kol aṉṉāy
</UL>
