<UL>
<LI>{AING 217-1} peru vari vēṅki poṉ maruḷ naṟu vī
<LI>{AING 217-2} māṉ iṉa perum kiḷi mēyal ārum
<LI>{AING 217-3} kāṉaka nāṭaṉ vara um ivaḷ
<LI>{AING 217-4} mēṉi pacappatu evaṉ kol aṉṉāy
