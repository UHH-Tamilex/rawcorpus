<P><i>((Originally extracted from master file ^KALI.OCP))</i>

<UL>
<LI>{AING 428-1} tēr celavu aḻuṅka tiruvil kōli
<LI>{AING 428-2} ār kali eḻili cōr toṭaṅkiṉṟu ē
<LI>{AING 428-3} vēntu viṭu viḻu toḻil oḻiya
<LI>{AING 428-4} yāṉ toṭaṅkiṉaṉāl niṉ puṟantara ē
