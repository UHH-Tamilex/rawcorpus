<P><i>((Originally extracted from master file ^KALI.OCP))</i>

<UL>
<LI>{AING 32-1} amma vāḻi tōḻi makiḻnaṉ
<LI>{AING 32-2} oru nāḷ nam il vantataṟku eḻu nāḷ
<LI>{AING 32-3} aḻupa eṉpa avaṉ peṇṭir
<LI>{AING 32-4} tī uṟu meḻukiṉ ñekiḻvaṉar viraintu ē
