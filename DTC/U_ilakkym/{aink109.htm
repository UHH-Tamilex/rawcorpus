<P><i>((Originally extracted from master file ^KALI.OCP))</i>

<UL>
<LI>{AING 109-1} aṉṉi vāḻi vēṇṭu aṉṉi neytal
<LI>{AING 109-2} nīr paṭar tūmpiṉ pū keḻu tuṟivaṉ
<LI>{AING 109-3} em tōḷ tuṟanta kāli evaṉ kol
<LI>{AING 109-4} pal nāḷ varum avaṉ aḷitta poḻutu ē
