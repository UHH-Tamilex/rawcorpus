<P><i>((Originally extracted from master file ^KALI.OCP))</i>

<UL>
<LI>{AING 234-1} miṉ avir vayaṅku iḻi ñekiḻa cāay
<LI>{AING 234-2} nal nutal pacattal yāvatu tuṉṉi
<LI>{AING 234-3} kaṉavil kāṇum ivaḷ ē
<LI>{AING 234-4} naṉavil kāṇāḷ niṉ mārpu ē teyyō
