<P><i>((Originally extracted from master file ^KALI.OCP))</i>

<UL>
<LI>{AING 290-1} aṟam puri ce kōl maṉṉaṉiṉ tām naṉi
<LI>{AING 290-2} ciṟantaṉa pōlum kiḷḷi piṟaṅkiya
<LI>{AING 290-3} pū kamaḻ kūntal koṭicci
<LI>{AING 290-4} nōkka um paṭum avaḷ ōppa um paṭum ē
</UL>
