<H2>Aiṅkuṟunūṟu</H2>
<P><i>((Originally extracted from master file ^KALI.OCP))</i>
<BR><i>((Last updated on 2004 April 14th))</i>

<UL>
<LI>{AING 42-1} makiḻ mika ciṟappa mayaṅkiṉaḷ kol ō
<LI>{AING 42-2} yāṇar ūra niṉ māṇ iḻi arivi
<LI>{AING 42-3} kāviri malir niṟi aṉṉa niṉ
<LI>{AING 42-4} mārpu naṉi vilakkal toṭaṅkiyōḷ ē
</UL>
