<UL>
<LI>{AING 55-1} karumpiṉ entiram kaḷiṟṟu etir piḷiṟṟum
<LI>{AING 55-2} tēr vaṇ kōmāṉ tēṉūr aṉṉa ivaḷ
<LI>{AING 55-3} nal aṇi nayantu nī tuṟattaliṉ
<LI>{AING 55-4} pallōr aṟiya pacantaṉṟu nutal ē
