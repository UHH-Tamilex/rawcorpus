<P><i>((Originally extracted from master file ^KALI.OCP))</i>

<UL>
<LI>{AING 253-1} kuṉṟa kuṟavaṉ cānta naṟum pukai
<LI>{AING 253-2} tēm kamaḻ cilampiṉ varai akam kamaḻum
<LI>{AING 253-3} kāṉaka nāṭaṉ varaiyiṉ
<LI>{AING 253-4} maṉṟal um uṭaiyaḷ kol tōḻi yāy ē
</UL>
