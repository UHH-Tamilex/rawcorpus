<UL>
<LI>{AING 493-1} ēṟu muraṇ ciṟappa ēṟu etir iraṅka
<LI>{AING 493-2} mātar māṉ piṇai maṟiyoṭu maṟuka
<LI>{AING 493-3} kār toṭaṅkiṉṟu ē kālai
<LI>{AING 493-4} nēr iṟai muṉkai niṉ uḷḷi yām vara ē
