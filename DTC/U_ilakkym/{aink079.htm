<UL>
<LI>{AING 79-1} putu puṉal āṭi amartta kaṇṇaḷ
<LI>{AING 79-2} yār makaḷ ivaḷ eṉa paṟṟiya makiḻna
<LI>{AING 79-3} yār makaḷ āyiṉum aṟiyāy
<LI>{AING 79-4} nī yār makaṉi em paṟṟiyōy ē
