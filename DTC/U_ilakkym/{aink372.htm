<P><i>((Originally extracted from master file ^KALI.OCP))</i>

<UL>
<LI>{AING 372-1} eṉ um uḷḷiṉaḷ kol ō taṉṉi
<LI>{AING 372-2} neñcu uṇa tēṟṟiya vañciṉa kāḷiyoṭu
<LI>{AING 372-3} aḻuṅkal mūtūr alar eḻa
<LI>{AING 372-4} ceḻum pal kuṉṟam iṟanta eṉ makaḷ ē
