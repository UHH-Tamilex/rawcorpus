<H2>Aiṅkuṟunūṟu</H2>
<P><i>((Originally extracted from master file ^KALI.OCP))</i>
<BR><i>((Last updated on 2004 April 14th))</i>

<UL>
<LI>{AING 190-1} taṇ naṟu neytal taḷi aviḻ vāṉ pū
<LI>{AING 190-2} veṇṇel arinar māṟṟiṉar aṟukkum
<LI>{AING 190-3} mellam pulampaṉ maṉṟa em
<LI>{AING 190-4} pal itaḻ uṇ kaṇ paṉi ceytōṉ ē
</UL>
