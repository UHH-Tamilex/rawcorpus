<UL>
<LI>{AING 97-1} pakaṉṟi vāl malar miṭinta kōṭṭi
<LI>{AING 97-2} karum tāḷ erumi kaṉṟu verūum
<LI>{AING 97-3} poyki ūraṉ makaḷ ivaḷ
