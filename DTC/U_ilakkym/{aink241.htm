<P><i>((Originally extracted from master file ^KALI.OCP))</i>

<UL>
<LI>{AING 241-1} nam uṟu tuyaram nōkki aṉṉai
<LI>{AING 241-2} vēlaṉ tantaṉaḷ āyiṉ a vēlaṉ
<LI>{AING 241-3} veṟi kamaḻ nāṭaṉ kēṇmai
<LI>{AING 241-4} aṟiyum ō tilla ceṟi eyiṟṟōy ē
