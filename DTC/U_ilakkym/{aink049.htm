<H2>Aiṅkuṟunūṟu</H2>
<P><i>((Originally extracted from master file ^KALI.OCP))</i>
<BR><i>((Last updated on 2004 April 14th))</i>

<UL>
<LI>{AING 49-1} am cil ōti acai naṭai pāṇmakaḷ
<LI>{AING 49-2} cil mīṉ corintu pal nel peṟūum
<LI>{AING 49-3} yāṇar ūra niṉ pāṇmakaṉ
<LI>{AING 49-4} yār nalam citaiya poykkum ō iṉi ē
</UL>
