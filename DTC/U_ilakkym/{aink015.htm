<UL>
<LI>{AING 15-1} maṇal āṭu malir niṟi virumpiya oḷ taḻi
<LI>{AING 15-2} puṉal āṭu makaḷirkku puṇar tuṇi utavum
<LI>{AING 15-3} vēḻa mūtūr ūraṉ
<LI>{AING 15-4} ūraṉ āyiṉum ūraṉ allaṉ ē
