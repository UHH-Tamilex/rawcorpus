<P><i>((Originally extracted from master file ^KALI.OCP))</i>

<UL>
<LI>{AING 201-1} aṉṉāy vāḻi vēṇṭu aṉṉi eṉṉi
<LI>{AING 201-2} tāṉ um malintāṉ emakku um taḻi āyiṉa
<LI>{AING 201-3} poṉ vī maṇi arumpiṉa ē
<LI>{AING 201-4} eṉṉa maram kol avar cārala ē
