<UL>
<LI>{AING 114-1} amma vāḻi tōḻi koṇkaṉ
<LI>{AING 114-2} nērēm āyiṉum celkuvam kol ō
<LI>{AING 114-3} kaṭaliṉ nārai iraṟṟum
