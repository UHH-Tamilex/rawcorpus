<H2>Aiṅkuṟunūṟu</H2>
<P><i>((Originally extracted from master file ^KALI.OCP))</i>
<BR><i>((Last updated on 2004 April 14th))</i>

<UL>
<LI>{AING 354-1} īrm piṇavu puṇarnta cennāy ēṟṟi
<LI>{AING 354-2} maṟi uṭi māṉ piṇi koḷḷātu kaḻiyum
<LI>{AING 354-3} ariya curaṉ vantaṉar ē
<LI>{AING 354-4} teri iḻi arivi niṉ paṇpu tara virintu ē
</UL>
