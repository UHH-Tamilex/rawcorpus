<P><i>((Originally extracted from master file ^KALI.OCP))</i>

<UL>
<LI>{AING 88-1} vaṇ tuṟi nayavarum vaḷa malar poyki
<LI>{AING 88-2} taṇ tuṟi ūraṉi evvi em vayiṉ
<LI>{AING 88-3} varutal vēṇṭutum eṉpatu
<LI>{AING 88-4} ollēm pōl yām atu vēṇṭutum ē
