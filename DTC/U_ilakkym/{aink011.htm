<H2>Aiṅkuṟunūṟu</H2>
<P><i>((Originally extracted from master file ^KALI.OCP))</i>
<BR><i>((Last updated on 2004 April 14th))</i>

<UL>
<LI>{AING 11-1} maṉi naṭu vayali vēḻam cuṟṟum
<LI>{AING 11-2} tuṟi kēḻ ūraṉ koṭumi nāṇi
<LI>{AING 11-3} nallaṉ eṉṟum yām ē
<LI>{AING 11-4} allaṉ eṉṉum eṉ taṭa mel tōḷ ē
</UL>
