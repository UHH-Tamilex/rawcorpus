<UL>
<LI>{AING 406-1} mātar uṇ kaṇ makaṉ viḷaiyāṭa
<LI>{AING 406-2} kātali taḻīi iṉitu iruntaṉaṉ ē
<LI>{AING 406-3} tātu ār piracam ūtum
<LI>{AING 406-4} pōtu ār puṟaviṉ nāṭu kiḻavōṉ ē
