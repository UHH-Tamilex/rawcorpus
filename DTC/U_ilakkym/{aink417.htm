<UL>
<LI>{AING 417-1} kār kalantaṉṟu āl puṟavu ē pala uṭaṉ
<LI>{AING 417-2} ēr parantaṉavāl puṉam ē ēr kalantu
<LI>{AING 417-3} tātu ār piracam moyppa
