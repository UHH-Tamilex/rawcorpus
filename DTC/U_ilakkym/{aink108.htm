<H2>Aiṅkuṟunūṟu</H2>
<P><i>((Originally extracted from master file ^KALI.OCP))</i>
<BR><i>((Last updated on 2004 April 14th))</i>

<UL>
<LI>{AING 108-1} aṉṉai vāḻi vēṇṭu aṉṉai kaḻiya
<LI>{AING 108-2} muṇṭakam malarum taṇ kaṭal cērppaṉ
<LI>{AING 108-3} em tōḷ tuṟantaṉaṉ āyiṉ
<LI>{AING 108-4} evaṉ kol maṟṟu avaṉ nayanta tōḷ ē
</UL>
