<UL>
<LI>{AING 80-1} pulakkuvem allēm poyyātu urimō
<LI>{AING 80-2} nalattaku makaḷirkku tōḷ tuṇi āki
<LI>{AING 80-3} tali peyal ce puṉal āṭi
<LI>{AING 80-4} tava naṉi civantaṉa makiḻna niṉ kaṇ ē
