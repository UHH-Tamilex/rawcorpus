<P><i>((Originally extracted from master file ^KALI.OCP))</i>

<UL>
<LI>{AING 28-1} uṇ tuṟi aṇaṅku ivaḷ uṟi nōy āyiṉ
<LI>{AING 28-2} taṇ cēṟu kaḷavaṉ varikkum ūraṟku
<LI>{AING 28-3} oḷ toṭi nekiḻa cāay
<LI>{AING 28-4} mel tōḷ pacappatu evaṉ kol aṉṉāy
