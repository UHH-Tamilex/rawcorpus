<H2>Aiṅkuṟunūṟu</H2>
<P><i>((Originally extracted from master file ^KALI.OCP))</i>

<UL>
<LI>{AING 104-1} aṉṉi vāḻi vēṇṭu aṉṉi nam ūr
<LI>{AING 104-2} palar maṭi poḻutiṉ nalam mika cāay
<LI>{AING 104-3} naḷḷeṉa vanta iyal tēr
<LI>{AING 104-4} celva koṇkaṉ celvaṉ aḵtu ūr ē
</UL>
