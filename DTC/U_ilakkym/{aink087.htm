<UL>
<LI>{AING 87-1} pakaṉṟi kaṇṇi pal āṉ kōvalar
<LI>{AING 87-2} karumpu kuṇil ā mām kaṉi utirkkum
<LI>{AING 87-3} yāṇar ūra niṉ maṉiyōḷ
<LI>{AING 87-4} yāri um pulakkum emmi maṟṟu evaṉ ō
