<UL>
<LI>{AING 107-1} aṉṉai vāḻi vēṇṭu aṉṉai eṉ tōḻi
<LI>{AING 107-2} cuṭar nutal pacappa cāay paṭar melintu
<LI>{AING 107-3} taṇ kaṭal paṭu tirai kēṭṭoṟum
<LI>{AING 107-4} tuñcāḷ ākutal nōku ō yāṉ ē
