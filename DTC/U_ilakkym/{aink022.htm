<H2>Aiṅkuṟunūṟu</H2>
<P><i>((Originally extracted from master file ^KALI.OCP))</i>
<BR><i>((Last updated on 2004 April 14th))</i>

<UL>
<LI>{AING 22-1} aḷḷal āṭiya puḷḷi kaḷavaṉ
<LI>{AING 22-2} muḷḷi vēr aḷai cellum ūraṉ
<LI>{AING 22-3} nalla colli maṇantu iṉi
<LI>{AING 22-4} nīyēṉ eṉṟatu evaṉ kol aṉṉāy
</UL>
