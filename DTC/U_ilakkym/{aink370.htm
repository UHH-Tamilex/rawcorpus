<P><i>((Originally extracted from master file ^KALI.OCP))</i>
<BR><i>((Last updated on 2004 April 14th))</i>

<UL>
<LI>{AING 370-1} vaṇ ciṉai kōṅkiṉ taṇ kamaḻ paṭalai
<LI>{AING 370-2} irum ciṟai vaṇṭiṉ perum kiḷai moyppa
<LI>{AING 370-3} nī nayantu uṟaiyappaṭṭōḷ
<LI>{AING 370-4} yāvaḷ ō em maṟaiyātīm ē
</UL>
