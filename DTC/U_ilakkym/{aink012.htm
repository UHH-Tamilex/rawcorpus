<P><i>((Originally extracted from master file ^KALI.OCP))</i>

<UL>
<LI>{AING 12-1} kari cēr vēḻam karumpiṉ pūkkum
<LI>{AING 12-2} tuṟi kēḻ ūraṉ koṭumi naṉṟu um
<LI>{AING 12-3} āṟṟuka tilla yām ē
<LI>{AING 12-4} tōṟka tilla eṉ taṭa mel tōḷ ē
