<UL>
<LI>{AING 73-1} vaṇṇa oḷ taḻi nuṭaṅka vāl iḻi
<LI>{AING 73-2} oḷ nutal arivi paṇṇi pāynteṉa
<LI>{AING 73-3} kaḷ naṟum kuvaḷi nāṟi
<LI>{AING 73-4} taṇṇeṉṟiciṉ ē perum tuṟi puṉal ē
