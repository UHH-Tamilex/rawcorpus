<P><i>((Originally extracted from master file ^KALI.OCP))</i>

<UL>
<LI>{AING 430-1} neṭum poṟi miciya kuṟum kāl koṉṟi
<LI>{AING 430-2} aṭar poṉ eṉṉa cuṭar itaḻ pakarum
<LI>{AING 430-3} kāṉ keḻu nāṭaṉ makaḷ ē
<LI>{AING 430-4} aḻutal āṉṟiciṉ aḻuṅkuval celavu ē
