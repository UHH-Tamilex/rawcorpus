<UL>
<LI>{AING 16-1} ōṅku pū vēḻattu tūmpu uṭi tiraḷ kāl
<LI>{AING 16-2} ciṟu toḻumakaḷir añcaṉam peyyum
<LI>{AING 16-3} pū kañal ūraṉi uḷḷi
<LI>{AING 16-4} pū pōl uṇ kaṇ poṉ pōrttaṉa ē
