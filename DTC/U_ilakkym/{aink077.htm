<P><i>((Originally extracted from master file ^KALI.OCP))</i>

<UL>
<LI>{AING 77-1} amma vāḻi ō makiḻna niṉ moḻival
<LI>{AING 77-2} pēr ūr alar eḻa nīr alai kalaṅki
<LI>{AING 77-3} niṉṉoṭu taṇ puṉal āṭutum
<LI>{AING 77-4} emmoṭu ceṉmō cellal niṉ maṉai ē
</UL>
