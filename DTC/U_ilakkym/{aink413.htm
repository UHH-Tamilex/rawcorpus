<UL>
<LI>{AING 413-1} niṉ nutal nāṟum naṟum taṇ puṟavil
<LI>{AING 413-2} niṉ ē pōla maññai āla
<LI>{AING 413-3} kār toṭaṅkiṉṟu āl poḻutu ē
<LI>{AING 413-4} pēr iyal arivai nām nayattaka ē
