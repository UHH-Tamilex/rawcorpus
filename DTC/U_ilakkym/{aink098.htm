<UL>
<LI>{AING 98-1} taṇ puṉal āṭum taṭam kōṭṭu erumai
<LI>{AING 98-2} tiṇ piṇi ampiyiṉ tōṉṟum ūra
<LI>{AING 98-3} oḷ toṭi maṭa makaḷ ivaḷiṉum
<LI>{AING 98-4} nuntai um ñāy um kaṭiyar ō niṉ ē
